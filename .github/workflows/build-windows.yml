name: Build Windows

on:
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write         

jobs:
  build-windows:
    name: Build Windows (MSVC + Qt5 + vcpkg)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ---------- Qt5 ----------
      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          cache: true
          modules: 'qtnetworkauth'

      # ---------- vcpkg ----------
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '319504a5326aa870edde46438c5455fa76305a56'

      # ---------- 用 NuGet 缓存代替已废弃的 x-gha ----------
      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          # 用 GitHub Packages 作为 NuGet 二进制缓存源
          $env:VCPKG_BINARY_SOURCES = "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"
          echo "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES" >> $env:GITHUB_ENV
          echo "VCPKG_FEATURE_FLAGS=manifests,binarycaching" >> $env:GITHUB_ENV

      - name: Authenticate NuGet for vcpkg cache
        shell: pwsh
        run: |
          # 配置 NuGet 认证，让 vcpkg 能读写 GitHub Packages
          & "$env:VCPKG_ROOT/vcpkg" fetch nuget `
            --nuget-source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --nuget-token "${{ secrets.GITHUB_TOKEN }}" 2>&1 | Out-Null
          # 也写一份到 NuGet 全局配置，确保 vcpkg 调用 nuget.exe 时能认证
          $nugetConfig = "$env:APPDATA/NuGet/NuGet.Config"
          if (-not (Test-Path (Split-Path $nugetConfig))) {
            New-Item -ItemType Directory -Force -Path (Split-Path $nugetConfig) | Out-Null
          }
          @"
<?xml version="1.0" encoding="utf-8"?>
<configuration>
  <packageSources>
    <add key="github" value="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" />
  </packageSources>
  <packageSourceCredentials>
    <github>
      <add key="Username" value="${{ github.actor }}" />
      <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
    </github>
  </packageSourceCredentials>
</configuration>
"@ | Out-File -Encoding utf8 $nugetConfig

      - name: Install dependencies with vcpkg
        shell: pwsh
        run: |
          vcpkg install libjpeg-turbo:x64-windows zlib:x64-windows libpng:x64-windows tiff:x64-windows boost:x64-windows

      # ---------- 配置 & 构建 ----------
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=OFF `
            -DCMAKE_PREFIX_PATH="${{ env.Qt5_DIR }};${{ github.workspace }}/vcpkg/installed/x64-windows"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # ---------- 手动打包：exe + 所有 DLL + 插件 ----------
      - name: Package (exe + all DLLs)
        shell: pwsh
        run: |
          $stage = "package-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # exe 和依赖 DLL（build/Release 下已经由 CMake 复制好）
          Copy-Item build/Release/*.exe $stage -Force
          Copy-Item build/Release/*.dll $stage -Force

          # Qt 插件（platforms/qwindows.dll 等）
          if (Test-Path "build/Release/platforms") {
            Copy-Item -Recurse build/Release/platforms $stage
          }
          # Qt 翻译
          if (Test-Path "build/Release/translations") {
            Copy-Item -Recurse build/Release/translations $stage
          }
          # Qt 图像格式插件
          if (Test-Path "build/Release/imageformats") {
            Copy-Item -Recurse build/Release/imageformats $stage
          }
          if (Test-Path "build/Release/iconengines") {
            Copy-Item -Recurse build/Release/iconengines $stage
          }
          if (Test-Path "build/Release/styles") {
            Copy-Item -Recurse build/Release/styles $stage
          }

          # 列出打包内容，方便排查
          Write-Host "=== Package contents ==="
          Get-ChildItem -Recurse $stage | Select-Object FullName

          Compress-Archive -Path "$stage/*" -DestinationPath "scantailor-advanced-win64.zip" -Force
          Get-ChildItem *.zip

      # ---------- 上传 artifact ----------
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: scantailor-windows-zip
          path: scantailor-advanced-win64.zip

      # ---------- 发布到 GitHub Release ----------
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: scantailor-advanced-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
