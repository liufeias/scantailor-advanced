name: Build Windows (MSVC + Qt5 + vcpkg)

on:
  # push:
  #   tags:
  #     - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 安装 Qt 5.15.2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          cache: true

      # 2. 准备 vcpkg 缓存（大幅降低重构时间）
      - name: Setup vcpkg GitHub Actions Cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # 3. 安装依赖（关键修改：绝不安装完整的 boost，仅安装所需组件）
      - name: Install dependencies via vcpkg
        run: |
          vcpkg install --triplet x64-windows `
            libjpeg-turbo `
            zlib `
            libpng `
            tiff `
            boost-headers `
            boost-unit-test-framework
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

      # 4. 配置 CMake
      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=OFF `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"

      # 5. 编译项目
      - name: Build Project
        run: |
          cmake --build build --config Release --parallel

      # 6. 收集并补齐所有 DLL（双保险，防止任何隐式 DLL 丢失）
      - name: Stage Dependencies and DLLs
        shell: pwsh
        run: |
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          $releaseDir = "build/Release"
          
          # 把 vcpkg bin 下面的所有 dll（包括 jpeg62.dll, liblzma.dll 等）复制到 Release 目录
          Write-Host "Copying all vcpkg runtime DLLs..."
          Copy-Item -Force "$vcpkgBin/*.dll" $releaseDir
          
          # 拷贝 Qt 依赖库
          windeployqt --release --no-translations --compiler-runtime "$releaseDir/scantailor.exe"

      # 7. 打包成 ZIP
      - name: Package with CPack
        run: |
          cd build
          cpack -G ZIP -C Release

      # 8. 收集安装包（若 CPack 漏网，此步骤确保 ZIP 内包含所有 DLL）
      - name: Ensure ZIP integrity
        shell: pwsh
        run: |
          # 也可以直接将打包好的 Release 目录打成便携版 zip 作为备用产物
          $zipName = Get-ChildItem -Path "build/*.zip" | Select-Object -First 1
          Write-Host "Generated package: $($zipName.FullName)"

      # 9. 上传 Artifact (每次 push 均可下载)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scantailor-advanced-windows-x64
          path: build/*.zip
          if-no-files-found: error

      # 10. 发布 Release (仅在打 tag 时触发，例如 git push origin v1.1.1)
      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
