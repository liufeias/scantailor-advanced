name: Build Windows (MSVC + Qt5 + vcpkg)

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  #pull_request:
  #  branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 安装 Qt 5.15.2 (已命中缓存，约 20 秒)
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          cache: true

      # 2. 核心提速：缓存 vcpkg 安装目录 (命中后直接跳过 8 分钟编译)
      - name: Cache vcpkg installed libraries
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/build-windows.yml') }}

      # 3. 安装依赖（如果缓存命中则自动跳过）
      - name: Install dependencies via vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          vcpkg install --triplet x64-windows `
            libjpeg-turbo `
            zlib `
            libpng `
            tiff `
            boost-test `
            boost-foreach `
            boost-intrusive `
            boost-property-tree `
            boost-multi-index `
            boost-polygon `
            boost-ptr-container `
            boost-dynamic-bitset `
            boost-circular-buffer `
            boost-bimap `
            boost-format `
            boost-accumulators `
            boost-ublas `
            boost-rational `
            boost-logic `
            boost-lambda

      # 4. 配置 CMake
      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=OFF `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"

      # 5. 多核编译项目
      - name: Build Project
        run: |
          cmake --build build --config Release --parallel

      # 6. 聚合所有依赖（DLL + Qt 插件 + 资源）
      - name: Stage Dependencies and DLLs
        shell: pwsh
        run: |
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          $releaseDir = "build/Release"
          
          # 拷贝所有第三方动态库
          Write-Host "Copying vcpkg DLLs..."
          Copy-Item -Force "$vcpkgBin/*.dll" $releaseDir
          
          # 拷贝 Qt 运行时及平台插件 (platforms/qwindows.dll 等)
          Write-Host "Running windeployqt..."
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime "$releaseDir/scantailor.exe"

      # 7. 打包唯一、完整的免安装绿色版 ZIP
      - name: Create Portable Zip
        shell: pwsh
        run: |
          $destZip = "build/scantailor-advanced-win64.zip"
          Write-Host "Compressing release directory into $destZip..."
          Compress-Archive -Path "build/Release/*" -DestinationPath $destZip -Force

      # 8. 上传单个完整包至 Actions Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scantailor-advanced-win64
          path: build/scantailor-advanced-win64.zip
          if-no-files-found: error

      # 9. 当推送 Tag（如 git tag v1.1.1 && git push origin v1.1.1）时，发布 Release
      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/scantailor-advanced-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
