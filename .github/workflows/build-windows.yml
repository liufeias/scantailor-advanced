name: Build Windows (MSVC + Qt5 + vcpkg)

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 安装 Qt 5.15.2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          cache: true

      # 2. 安装必要依赖（只需 boost-test 和 boost-headers，约 2-3 分钟搞定）
      - name: Install dependencies via vcpkg
        run: |
          vcpkg install --triplet x64-windows `
            libjpeg-turbo `
            zlib `
            libpng `
            tiff `
            boost-headers `
            boost-test

      # 3. 配置 CMake
      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=OFF `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"

      # 4. 编译项目
      - name: Build Project
        run: |
          cmake --build build --config Release --parallel

      # 5. 补齐所有 DLL（防止任何漏网的 dll）
      - name: Stage Dependencies and DLLs
        shell: pwsh
        run: |
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          $releaseDir = "build/Release"
          
          # 拷贝 vcpkg 下所有 dll (jpeg62.dll, liblzma.dll, tiff.dll, zlib.dll 等)
          Write-Host "Copying vcpkg DLLs..."
          Copy-Item -Force "$vcpkgBin/*.dll" $releaseDir
          
          # 拷贝 Qt 运行时及插件
          Write-Host "Running windeployqt..."
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime "$releaseDir/scantailor.exe"

      # 6. 打包成 ZIP
      - name: Package with CPack
        run: |
          cd build
          cpack -G ZIP -C Release

      # 7. 上传构建产物 (在 GitHub Actions 页面随时可下载)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scantailor-advanced-windows-x64
          path: build/*.zip
          if-no-files-found: error

      # 8. 发布 Release (仅在打 tag 时触发，例如 git tag v1.1.1 && git push origin v1.1.1)
      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
