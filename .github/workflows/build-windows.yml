name: Build Windows (MSVC + Qt5 + vcpkg)

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 必须赋予写权限，否则 softprops/action-gh-release 无法上传 Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 安装 Qt 5.15.2
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          cache: true

      # 2. 安装所有必需的依赖项
      # 注：除 boost-test 外，其余 boost 模块全部为 Header-only 库，解压只需几秒钟，总耗时仅约 5 分钟
      - name: Install dependencies via vcpkg
        run: |
          vcpkg install --triplet x64-windows `
            libjpeg-turbo `
            zlib `
            libpng `
            tiff `
            boost-test `
            boost-foreach `
            boost-intrusive `
            boost-property-tree `
            boost-multi-index `
            boost-polygon `
            boost-ptr-container `
            boost-dynamic-bitset `
            boost-circular-buffer `
            boost-bimap `
            boost-format `
            boost-accumulators `
            boost-ublas `
            boost-rational `
            boost-logic `
            boost-lambda

      # 3. 配置 CMake
      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=OFF `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR"

      # 4. 多核并行编译项目
      - name: Build Project
        run: |
          cmake --build build --config Release --parallel

      # 5. 补齐所有依赖 DLL（包括 jpeg62.dll, liblzma.dll, tiff.dll, zlib.dll 及 Qt 运行库）
      - name: Stage Dependencies and DLLs
        shell: pwsh
        run: |
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          $releaseDir = "build/Release"
          
          # 拷贝 vcpkg 下所有生成的运行库到 Release 目录
          Write-Host "Copying all vcpkg runtime DLLs to $releaseDir..."
          Copy-Item -Force "$vcpkgBin/*.dll" $releaseDir
          
          # 使用 windeployqt 自动部署 Qt 运行时和平台插件（如 platforms/qwindows.dll）
          Write-Host "Running windeployqt..."
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime "$releaseDir/scantailor.exe"

      # 6. 使用 CPack 打包生成安装 ZIP 包
      - name: Package with CPack
        run: |
          cd build
          cpack -G ZIP -C Release

      # 7. 确保 CPack 打包的 ZIP 完整性（兜底：若 CPack 漏掉了某些 DLL，直接把完整的 Release 目录补充打包）
      - name: Create Portable Zip from Release Directory
        shell: pwsh
        run: |
          # 将最终包含全部有效 DLL 的 Release 目录直接打包，保证 100% 能双击运行
          $destZip = "build/scantailor-advanced-win64-portable.zip"
          Write-Host "Compressing complete release folder into $destZip..."
          Compress-Archive -Path "build/Release/*" -DestinationPath $destZip -Force

      # 8. 上传 Artifact (日常任何 Push 均可在 GitHub Actions 页面下载)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scantailor-advanced-windows-x64
          path: build/*.zip
          if-no-files-found: error

      # 9. 自动发布到 Release
      # 触发条件：当你推送 tag（例如 git tag v1.1.2 && git push origin v1.1.2）时会自动发布
      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
